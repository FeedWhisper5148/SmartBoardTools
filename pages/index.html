<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>智慧白板助手</title>
    <link rel="stylesheet" href="./layui/css/layui.css">
    <link rel="stylesheet" href="./css/index.css">
</head>

<script>
    function handleFormSubmit(event) {
        event.preventDefault()
        // console.log('表单被提交，但页面没有跳转！');
    }
</script>

<body>
    <div class="container">
        <div class="nav clearfix">
            <span class="settings leftfix">
                <a>设置</a>
            </span>
            <span class="info leftfix">
                <a href="./AppInfo.html">软件信息</a>
            </span>
        </div>
        <div class="main clearfix">
            <span class="countDownSetting">
                <!-- <span>倒数日:</span> -->
                <form class="layui-form" action="">
                    <div class="layui-form-item">
                        <label class="layui-form-label clearfix">倒数日：</label>
                        <div class="layui-input-block leftfix">
                            <input type="text" required lay-verify="required" placeholder="例如：20250324"
                                autocomplete="off" class="layui-input" id="countDownDayInput">
                        </div>
                        <button class=layui-btn id="countDownDayButton" onclick="handleFormSubmit(event)">确定</button>
                    </div>
                </form>
                <!-- <button id="countDownDayButton">确定</button> -->
            </span>
        </div>
        <div class="layui-form switch">
            <div class="layui-form-item classScheduleSwitch">
                <span class="label">课程表&nbsp;</span>
                <input checked type="checkbox" name="AAA" lay-skin="switch" lay-filter="classScheduleSwitch">
            </div>
            <div class="layui-form-item">
                <span class="label">每日一词&nbsp;</span>
                <input checked type="checkbox" name="AAA" lay-skin="switch" lay-filter="memoriseSwitch">
            </div>
        </div>
    </div>
    <form class="layui-form">
        <button class=layui-btn id="editClassScheduleButton">修改课程表</button>
        <button class=layui-btn id="editTimeTableButton">修改时间表</button>
        <button class=layui-btn id="aiButton">问AI</button>
        <button class=layui-btn id="quit">退出</button>
    </form>
    <div class="tip">注：默认上课状态下不会显示课程表，没显示即为上课时间，可在右下角托盘控制软件</div>
    <div class="tip">若您正处于上课时间，将系统时间改为13：00～13：30后重新打开即可看到课程表页面</div>
    </div>
</body>
<script src="./layui/layui.js" charset="utf-8"></script>
<script src="./js/index.js"></script>

</html>
