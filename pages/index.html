<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>SmartBoardTools</title>
    <link rel="stylesheet" href="layui/css/layui.css">
    <link rel="stylesheet" href="css/index.css">
</head>

<script>
    function handleFormSubmit(event) {
        event.preventDefault()
        // console.log('表单被提交，但页面没有跳转！');
    }
</script>

<body>
    <div class="container">
        <div class="nav clearfix">
            <span class="settings leftfix">
                <a href="#">设置</a>
            </span>
            <span class="info leftfix">
                <a href="./AppInfo.html">软件信息</a>
            </span>
        </div>
        <div class="main clearfix">
            <span class="countDownSetting">
                <!-- <span>倒数日:</span> -->
                <form class="layui-form" action="">
                    <div class="layui-form-item">
                        <label class="layui-form-label clearfix">倒数日：</label>
                        <div class="layui-input-block leftfix">
                            <input type="text" required lay-verify="required" placeholder="例如：20250324"
                                autocomplete="off" class="layui-input" id="countDownDayInput">
                        </div>
                        <button class=layui-btn id="countDownDayButton" onclick="handleFormSubmit(event)">确定</button>
                    </div>
                </form>
                <!-- <button id="countDownDayButton">确定</button> -->
            </span>
        </div>
        <br>
        <!-- <form class="layui-form switch"> -->
            <!-- <button class=layui-btn id="editClassScheduleButton">修改课程表</button>
            <button class=layui-btn id="quit">退出</button> -->
            <div class="layui-form-item">
                <div class="layui-input-block">
                    <label class="lable">课程表</label>
                    <input type="checkbox" checked class="switch" id="classScheduleSwitch" title="课程表"> 
                </div>
                <br>
                <div class="layui-input-block">
                    <label class="lable">每日一词</label>
                    <input type="checkbox" checked class="switch" id="memoriseWordSwitch" title="每日一词"> 
                </div>
            </div>
        <!-- </form> -->
        <form class="layui-form">
            <button class=layui-btn id="editClassScheduleButton">修改课程表</button>
            <button class=layui-btn id="quit">退出</button>
        </form>
        <div class="tip">注：默认上课状态下不会显示课程表，没显示即为上课时间，可在右下角托盘控制软件</div>
        <div class="tip">若您正处于上课时间，将系统时间改为13：00～13：30即可看到课程表页面</div>
    </div>
</body>
<script src="layui/layui.all.js" charset="utf-8"></script>
<script src="./js/index.js"></script>

</html>
