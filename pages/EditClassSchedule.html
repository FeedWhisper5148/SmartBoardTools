<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>EditClassSchedule</title>
  <link rel="stylesheet" href="./layui/css/layui.css">
  <link rel="stylesheet" href="./css/EditClassSchedule.css">
</head>

<script>
  function handleFormSubmit(event) {
    event.preventDefault()
    // console.log('表单被提交，但页面没有跳转！');
  }
</script>

<body>
  <div class="title">当前课程表</div>
  <div id="currentClassSchedule">
    <!-- <div id="0"></div>
        <div id="1"></div>
        <div id="2"></div>
        <div id="3"></div>
        <div id="4"></div>
        <div id="5"></div>
        <div id="6"></div> -->
  </div>
  <div class="tip">提示：第一行为周日，最后一行为周六</div>
  <div class="title">修改课程表</div>
  <form class="layui-form" action="">
    <div class="layui-form-item">
      <label class="layui-form-label">星期：</label>
      <div class="layui-input-block">
        <input id="week" type="text" required lay-verify="required" autocomplete="off" class="layui-input">
      </div>
      <label class="layui-form-label">节数：</label>
      <div class="layui-input-block">
        <input id="index" type="text" required lay-verify="required" autocomplete="off" class="layui-input">
      </div>
      <label class="layui-form-label">课程名称：</label>
      <div class="layui-input-block">
        <input id="course" type="text" required lay-verify="required" autocomplete="off" class="layui-input">
      </div>
      <button class=layui-btn id="confirm" onclick="handleFormSubmit(event)">确定</button>
    </div>
  </form>
    <div class="tip">注：重启后生效</div>
</body>

<script src="./layui/layui.js"></script>
<script src="./js/EditClassSchedule.js"></script>

</html>
