<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <title>EditClassSchedule</title>
    <link rel="stylesheet" href="./layui/css/layui.css">
    <link rel="stylesheet" href="./css/EditClassSchedule.css">
</head>

<body>
    <div class="title">当前课程表</div>
    <div id="currentClassSchedule">
        <!-- <div id="0"></div>
        <div id="1"></div>
        <div id="2"></div>
        <div id="3"></div>
        <div id="4"></div>
        <div id="5"></div>
        <div id="6"></div> -->
    </div>
    <div class="title">修改课程表</div>
    <form class="layui-form" action="">
        <div class="layui-form-item">
          <label class="layui-form-label">星期：</label>
          <div class="layui-input-block">
            <input type="text" name="title" required  lay-verify="required" autocomplete="off" class="layui-input">
          </div>
          <label class="layui-form-label">节数：</label>
          <div class="layui-input-block">
            <input type="text" name="title" required  lay-verify="required" autocomplete="off" class="layui-input">
          </div>
          <label class="layui-form-label">课程名称：</label>
          <div class="layui-input-block">
            <input type="text" name="title" required  lay-verify="required" autocomplete="off" class="layui-input">
          </div>
          <button class=layui-btn>确定</button>
        </div>
    </form>
</body>
<script src="./js/EditClassSchedule.js"></script>

</html>
